        // ============================================================================

        const createOptimizedAvatar = (imgSrc) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => {
                    const largeSize = 256;
                    const largeCanvas = document.createElement('canvas');
                    largeCanvas.width = largeSize;
                    largeCanvas.height = largeSize;
                    const lCtx = largeCanvas.getContext('2d');
                    lCtx.beginPath();
                    lCtx.arc(largeSize/2, largeSize/2, largeSize/2, 0, Math.PI * 2);
                    lCtx.closePath();
                    lCtx.clip();
                    lCtx.drawImage(img, 0, 0, largeSize, largeSize);

                    const smallSize = 64; 
                    const smallCanvas = document.createElement('canvas');
                    smallCanvas.width = smallSize;
                    smallCanvas.height = smallSize;
                    const sCtx = smallCanvas.getContext('2d');
                    sCtx.beginPath();
                    sCtx.arc(smallSize/2, smallSize/2, smallSize/2, 0, Math.PI * 2);
                    sCtx.closePath();
                    sCtx.clip();
                    sCtx.drawImage(img, 0, 0, smallSize, smallSize);

                    resolve({ small: smallCanvas, large: largeCanvas });
                };
                img.onerror = () => resolve(null);
                img.src = imgSrc;
            });
        };

        const generateSmoothTrack = (controlPoints, segments = 50) => {
            const points = [];
            const len = controlPoints.length;
            const pts = [controlPoints[len - 1], ...controlPoints, controlPoints[0], controlPoints[1]];
            for (let i = 0; i < len; i++) {
                const p0 = pts[i], p1 = pts[i + 1], p2 = pts[i + 2], p3 = pts[i + 3];
                for (let t = 0; t < segments; t++) {
                    const t1 = t / segments, t2 = t1 * t1, t3 = t2 * t1;
                    points.push({
                        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t1 + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
                        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t1 + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
                    });
                }
            }
            return points;
        };

        const addCurveData = (trackPoints) => {
            const len = trackPoints.length;
            trackPoints.forEach((p, i) => {
                const pPrev = trackPoints[(i - 6 + len) % len];
                const pNext = trackPoints[(i + 6) % len];
                const angle1 = Math.atan2(p.y - pPrev.y, p.x - pPrev.x);
                const angle2 = Math.atan2(pNext.y - p.y, pNext.x - p.x);
                let diff = Math.abs(angle1 - angle2);
                if (diff > Math.PI) diff = 2 * Math.PI - diff;
                p.isCurve = diff > 0.15;
            });
            return trackPoints;
        };

        const calculateTrackBounds = (trackPoints) => {
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (const p of trackPoints) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }
            return { center: { x: (minX + maxX) / 2, y: (minY + maxY) / 2 }, minX, maxX, minY, maxY };
        };

        // ============================================================================
        // --- DRAWING FUNCTIONS ---
        // ============================================================================
        
        const renderStaticTrack = (trackPoints, trackWidth, bounds, surfaceColor) => {
            const padding = 500; 
            const width = (bounds.maxX - bounds.minX) + padding * 2;
            const height = (bounds.maxY - bounds.minY) + padding * 2;
            
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // --- THEME BACKGROUND (CANVAS) ---
            ctx.fillStyle = surfaceColor; 
            ctx.fillRect(0, 0, width, height);

            ctx.translate(-bounds.minX + padding, -bounds.minY + padding);

            // --- DECORATIVE ELEMENTS GENERATION (REMOVED) ---
            // Süslemeler kaldırıldı, sadece pist kalacak.

            const trackLen = trackPoints.length;
            
            // Kerbs
            ctx.save();
            ctx.lineCap = 'butt';
            ctx.lineWidth = trackWidth + 50;
            const makePath = () => {
                ctx.beginPath();
                let isDrawing = false;
                for (let i = 0; i < trackLen; i++) {
                    if (trackPoints[i].isCurve) {
                        if (!isDrawing) { ctx.moveTo(trackPoints[i].x, trackPoints[i].y); isDrawing = true; }
                        const nextIndex = (i + 1) % trackLen;
                        ctx.lineTo(trackPoints[nextIndex].x, trackPoints[nextIndex].y);
                        if (!trackPoints[nextIndex].isCurve) isDrawing = false;
                    } else { isDrawing = false; }
                }
            };
            makePath();
            ctx.strokeStyle = '#ef4444';
            ctx.stroke();
            makePath();
            ctx.strokeStyle = '#ffffff';
            ctx.setLineDash([40, 40]);
            ctx.stroke();
            ctx.restore();

            // Asphalt (DARK TRACK)
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = trackWidth;
            ctx.strokeStyle = '#334155'; // Dark Slate
            ctx.beginPath();
            ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
            for (let i = 1; i < trackPoints.length; i++) ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
            ctx.closePath();
            ctx.stroke();
            
            ctx.lineWidth = trackWidth - 4; ctx.strokeStyle = '#f8fafc'; ctx.stroke();

                                                <label className="text-xs text-white/60 block mb-2">Medya Dosyaları</label>
                                                <div className="flex flex-col gap-2">
                                                    <div className="flex items-center gap-3"><button onClick={() => musicInputRef.current?.click()} className="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-xs font-bold transition flex items-center gap-2 border border-white/10 w-full justify-center text-white"><Music size={14} /> Müzik Seç (.mp3)</button><input ref={musicInputRef} type="file" accept="audio/*" className="hidden" onChange={handleMusicUpload} /></div>
                                                    <div className="flex items-center gap-3"><button onClick={() => effectInputRef.current?.click()} className="px-4 py-2 bg-purple-500/20 hover:bg-purple-500/30 rounded-lg text-xs font-bold transition flex items-center gap-2 border border-purple-500/30 w-full justify-center text-purple-200"><Sparkles size={14} /> Efekt Seç (.webm/.mp4)</button><input ref={effectInputRef} type="file" accept="video/*" className="hidden" onChange={handleEffectUpload} /></div>
                                                </div>
                                                {(customMusicName || customEffectName) && (
                                                    <div className="mt-2 space-y-1">
                                                        {customMusicName && <div className="text-[10px] text-white/60 flex items-center gap-1"><Music size={10} /> {customMusicName}</div>}
                                                        {customEffectName && <div className="text-[10px] text-purple-300 flex items-center gap-1"><Sparkles size={10} /> {customEffectName}</div>}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        <div className={`border-2 border-dashed rounded-xl p-6 text-center transition-all cursor-pointer ${dragActive ? 'border-blue-500 bg-blue-500/10' : 'border-white/20 hover:border-white/40 bg-white/5'}`} onDragEnter={(e) => { e.preventDefault(); setDragActive(true); }} onDragLeave={() => setDragActive(false)} onDragOver={(e) => { e.preventDefault(); setDragActive(true); }} onDrop={handleDrop} onClick={() => fileInputRef.current?.click()}>
                                            <input ref={fileInputRef} type="file" className="hidden" multiple accept="image/*,.html,.htm" {...{ webkitdirectory: "" }} onChange={handleChange} />
                                            {importedUsers ? (<div className="space-y-2"><ImageIcon size={32} className="mx-auto text-green-500" /><p className="text-green-400 font-bold text-sm">{importedUsers.length} Yarışçı Hazır!</p><button onClick={(e) => { e.stopPropagation(); clearImportedUsers(); }} className="text-xs text-red-400 hover:underline flex items-center justify-center gap-1 mx-auto"><X size={12} /> Listeyi Temizle</button></div>) : (<div className="space-y-2"><FolderInput size={32} className="mx-auto text-white/40" /><p className="text-white/80 font-medium text-sm">Racers Klasörünü Sürükle</p><p className="text-white/40 text-xs">(Veya resim dosyalarını / HTML dosyasını)</p></div>)}
                                        </div>
                                        <div className={importedUsers ? 'opacity-50 pointer-events-none' : ''}><div className="flex justify-between mb-2"><label className="text-sm text-white/60 font-medium">Yarışçı Sayısı</label><span className={`font-bold bg-white/10 px-2 rounded text-white`}>{config.racerCount}</span></div><input type="range" min="50" max="500000" step="10" value={config.racerCount} onChange={(e) => setConfig(prev => ({ ...prev, racerCount: parseInt(e.target.value) }))} className="w-full h-2 bg-black/40 rounded-lg appearance-none cursor-pointer accent-white" /></div>
                                        <div><label className="text-sm text-white/60 font-medium mb-2 block">Pist</label><div className="grid gap-2">{trackButtons}</div></div>
                                        <div><label className="text-sm text-white/60 font-medium mb-2 block">Tur Sayısı</label><div className="flex gap-2">{lapButtons}</div></div>
                                        <button onClick={startSequence} className={`w-full py-4 ${currentTheme.accent} hover:brightness-110 text-white rounded-xl font-black text-lg shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2`}><Play size={24} fill="currentColor" /> YARIŞI BAŞLAT</button>
                                    </div>
                                </div>
                                <div className={`relative rounded-2xl overflow-hidden border border-white/20 mx-auto shadow-2xl`} style={{ width: '100%', maxWidth: '540px', aspectRatio: '9 / 16', backgroundColor: currentTheme.surface }}>
                                    <canvas ref={canvasRef} width="1080" height="1920" style={{ width: '100%', height: '100%', display: 'block', objectFit: 'contain', backgroundColor: currentTheme.surface }} />
                                    <div className="absolute inset-0 pointer-events-none flex items-center justify-center"><div className="text-black/30 text-center"><Circle size={48} className="mx-auto mb-2 opacity-50" /><p className="text-sm font-bold">Ayarları yapın ve yarışı başlatın</p></div></div>
                                </div>
                            </div>
                        ) : (
                            <div className="relative rounded-2xl overflow-hidden border border-white/20 mx-auto shadow-2xl" style={{ width: '100%', maxWidth: '540px', aspectRatio: '9 / 16', maxHeight: '90vh', backgroundColor: currentTheme.surface }}>
                                <canvas ref={canvasRef} width="1080" height="1920" style={{ width: '100%', height: '100%', display: 'block', objectFit: 'contain', backgroundColor: currentTheme.surface }} />
                                {gameState === 'countdown' && (<div className="absolute inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50"><div className="text-9xl font-black text-white animate-ping duration-700">{countdown}</div></div>)}
                                {gameState === 'racing' && !showFinalModal && (
                                    <>
                                        <div className="absolute top-4 right-4 space-y-2 flex flex-col items-end">
                                            <button onClick={() => setIsSpeakerMuted(!isSpeakerMuted)} className="p-2 rounded-full bg-white/90 border border-slate-200 hover:bg-white transition z-50 mb-2 shadow-sm text-black">{isSpeakerMuted ? <VolumeX size={20} className="text-red-500" /> : <Volume2 size={20} className="text-green-500" />}</button>
                                            {isRecording && (<div className="px-4 py-2 bg-red-500/20 border border-red-500 text-red-500 rounded-lg text-xs font-bold flex items-center gap-2 animate-pulse mb-2 bg-black/50"><div className="w-3 h-3 bg-red-500 rounded-full"></div> REC</div>)}
                                            <button onClick={() => setCameraMode(p => p === 'leader' ? 'wide' : 'leader')} className="w-full px-4 py-2 bg-white/90 hover:bg-white rounded-lg text-xs font-bold transition flex items-center gap-2 border border-slate-200 mb-2 shadow-sm text-slate-700"><Camera size={14} /> {cameraMode === 'leader' ? 'Lider' : 'Geniş'}</button>
                                            <button onClick={handleExitRace} className="w-full px-4 py-2 bg-red-500/20 text-red-500 hover:bg-red-500/30 rounded-lg text-xs font-bold transition border border-red-500/30 bg-black/50">Bitir</button>
                                        </div>
                                    </>
                                )}
                                {showFinalModal && (
                                    <div className="absolute inset-0 bg-slate-900/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 animate-in fade-in duration-500">
                                        <div className="text-center mb-6">
                                            <Trophy size={60} className="text-yellow-500 mb-4 mx-auto animate-bounce" /><h2 className="text-3xl font-black text-white mb-4">{(recordedVideoUrl || videoUrlRef.current) ? 'Video Hazır!' : 'Video İşleniyor...'}</h2><p className="text-slate-400 mb-6">{(recordedVideoUrl || videoUrlRef.current) ? 'Yarışın kaydedildi ve indirmeye hazır' : 'Lütfen bekleyin, video hazırlanıyor...'}</p>
                                            <div className="flex gap-4 justify-center">
                                                <button onClick={downloadVideo} disabled={!recordedVideoUrl && !videoUrlRef.current} className={`px-6 py-3 ${(recordedVideoUrl || videoUrlRef.current) ? 'bg-green-600 hover:bg-green-700' : 'bg-gray-400 cursor-wait'} text-white rounded-full font-bold transition flex items-center gap-2 shadow-lg`}><Download size={20} className={(!recordedVideoUrl && !videoUrlRef.current) ? 'animate-bounce' : ''} /> {(recordedVideoUrl || videoUrlRef.current) ? 'Videoyu İndir' : 'Hazırlanıyor...'}</button>
                                                <button onClick={downloadJSON} disabled={!allRaceResults} className={`px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-full font-bold transition flex items-center gap-2 shadow-lg ${!allRaceResults ? 'opacity-50 cursor-not-allowed' : ''}`}><FileJson size={20} /> Sonuçları İndir (.json)</button>
                                                <button onClick={handleReturnToMenu} className="px-6 py-3 bg-slate-100 text-slate-700 rounded-full font-bold hover:bg-slate-200 transition shadow-lg border border-slate-200">Menüye Dön</button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InstagramGrandPrix />);
    </script>
</body>
</html>
